<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.f{font-family:Caprasimo,Georgia,serif;font-weight:400}
</style>
</head><body>

<div style="width: 1280px; height: 900px; box-sizing: border-box; background: #fdf2ea; font-family: Figtree, system-ui, sans-serif; color: #201e1d; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">

  <section aria-label="Signed out" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #ffc6a5; position: relative; overflow: hidden; padding: 40px">
    <div aria-hidden="true" style="position: relative; width: 340px; height: 190px">
      <span style="position: absolute; left: 50%; bottom: 0; width: 150px; height: 150px; margin-left: -75px; border-radius: 75px; background: #ffe1d0"></span>
      <span style="position: absolute; left: 20px; bottom: 0; width: 22px; height: 150px; border-radius: 11px 11px 3px 3px; background: #8c491a"></span>
      <span style="position: absolute; right: 20px; bottom: 0; width: 22px; height: 150px; border-radius: 11px 11px 3px 3px; background: #8c491a"></span>
      <span style="position: absolute; left: 50px; bottom: 0; width: 16px; height: 96px; border-radius: 8px 8px 2px 2px; background: #1c5b82; transform: skewY(-8deg)"></span>
      <span style="position: absolute; left: 74px; bottom: 0; width: 16px; height: 104px; border-radius: 8px 8px 2px 2px; background: #d67f48; transform: skewY(-8deg)"></span>
      <span style="position: absolute; left: 98px; bottom: 0; width: 16px; height: 98px; border-radius: 8px 8px 2px 2px; background: #8fa073; transform: skewY(-8deg)"></span>
      <span style="position: absolute; right: 50px; bottom: 0; width: 16px; height: 98px; border-radius: 8px 8px 2px 2px; background: #97cceb; transform: skewY(8deg)"></span>
      <span style="position: absolute; right: 74px; bottom: 0; width: 16px; height: 104px; border-radius: 8px 8px 2px 2px; background: #f6a06b; transform: skewY(8deg)"></span>
      <span style="position: absolute; right: 98px; bottom: 0; width: 16px; height: 96px; border-radius: 8px 8px 2px 2px; background: #1c5b82; transform: skewY(8deg)"></span>
    </div>
    <h1 class="f" style="margin: 0; font-size: 34px; text-align: center; position: relative">The gate’s open</h1>
    <p style="margin: 0; font-size: 16px; color: #474238; text-align: center; max-width: 340px; position: relative">Your boards are shared only with the roommates you invite.</p>
    <button type="button" style="position: relative; display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: 24px; border: 1px solid #dadce0; background: #fff; font: inherit; font-size: 15px; font-weight: 600; color: #3c4043">
      <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0)"></span>Sign in with Google
    </button>
    <a href="#" style="position: relative; font-size: 15px; font-weight: 700; color: #0b4163">Or wander the demo board</a>
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(#f6a06b 0 16%, #d67f48 16% 32%, #458ebb 32% 52%, #1c5b82 52%)"></span>
  </section>

  <section aria-label="Your boards" style="display: flex; flex-direction: column; gap: 18px; padding: 56px 52px">
    <h1 class="f" style="margin: 0; font-size: 34px">Your boards</h1>
    
      <a href="#" style="display: flex; align-items: center; gap: 18px; text-decoration: none; color: inherit; background: #fff9f5; border-radius: 26px; padding: 18px 20px; position: relative; overflow: hidden">
        <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 4px; height: 58px">
          <span style="width: 14px; height: 50px; border-radius: 7px 7px 2px 2px; background: #f6a06b"></span><span style="width: 14px; height: 58px; border-radius: 7px 7px 2px 2px; background: #458ebb"></span><span style="width: 14px; height: 46px; border-radius: 7px 7px 2px 2px; background: #8fa073"></span><span style="width: 14px; height: 54px; border-radius: 7px 7px 2px 2px; background: #97cceb"></span>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span class="f" style="font-size: 21px">Our place by the bluffs</span>
          <span style="font-size: 14px; color: #474238">4 roommates · 6 places · Lease 2027–28</span>
        </span>
        <span class="f" style="font-size: 22px; color: #b2622d">→</span>
      </a>
    
      <a href="#" style="display: flex; align-items: center; gap: 18px; text-decoration: none; color: inherit; background: #fff9f5; border-radius: 26px; padding: 18px 20px; position: relative; overflow: hidden">
        <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 4px; height: 58px">
          <span style="width: 14px; height: 50px; border-radius: 7px 7px 2px 2px; background: #d67f48"></span><span style="width: 14px; height: 58px; border-radius: 7px 7px 2px 2px; background: #1c5b82"></span>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span class="f" style="font-size: 21px">Summer sublet</span>
          <span style="font-size: 14px; color: #474238">2 roommates · 3 places · Lease 2027</span>
        </span>
        <span class="f" style="font-size: 22px; color: #b2622d">→</span>
      </a>
    
    <a href="#" style="display: flex; align-items: center; gap: 18px; text-decoration: none; color: #b2622d; border: 2px dashed #b2622d; border-radius: 26px; padding: 18px 20px">
      <span aria-hidden="true" style="width: 14px; height: 50px; border-radius: 7px 7px 2px 2px; border: 2px dashed #b2622d; box-sizing: border-box"></span>
      <span class="f" style="font-size: 20px">Start a new board</span>
    </a>
  </section>
</div>
</body></html>
